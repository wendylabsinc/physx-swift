name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  documentation:
    name: DocC
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Generate documentation
        run: swift package generate-documentation --target PhysX --warnings-as-errors
